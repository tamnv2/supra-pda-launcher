name: DT50 Battery Pilot APK (no automatic rollout)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dt50-battery-pilot
  cancel-in-progress: false

jobs:
  release-pilot:
    # Only dispatch from merged main; pilot never modifies the stable launcher-channel.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate pilot is ahead of production version
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < release/version.txt)" = "0.3.24" || {
            echo "Pilot version 0.3.25 is only approved when stable is v0.3.24."
            exit 1
          }

      - name: Restore existing production signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing keystore secret"; exit 1; }
          test -n "$STORE_PASS" || { echo "Missing keystore password"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing keystore alias"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing key password"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build DT50 diagnostic pilot v0.3.25
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PVERSION_NAME=0.3.25 -PVERSION_CODE=325

      - name: Verify signature and prepare isolated pilot APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$SRC"
          mkdir -p dist
          cp "$SRC" "dist/SUPRA-PDA-Launcher-DT50-Pilot-v0.3.25.apk"
          cd dist
          sha256sum "SUPRA-PDA-Launcher-DT50-Pilot-v0.3.25.apk" > "SUPRA-PDA-Launcher-DT50-Pilot-v0.3.25.apk.sha256"

      - name: Create prerelease without changing launcher-channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dt50-battery-pilot-v0.3.25"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Pilot prerelease already exists; refusing silent replacement."
            exit 1
          fi
          gh release create "$TAG" \
            dist/SUPRA-PDA-Launcher-DT50-Pilot-v0.3.25.apk \
            dist/SUPRA-PDA-Launcher-DT50-Pilot-v0.3.25.apk.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Launcher DT50 Battery Diagnostics Pilot v0.3.25" \
            --notes "Manual-install diagnostic pilot for selected Urovo DT50 only. Stable launcher-channel manifest and mandatory update policy remain unchanged. Same app ID and production signature, no device owner or bypass permissions."
