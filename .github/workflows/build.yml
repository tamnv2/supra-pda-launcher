name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Launcher v0.3.25 safety regression
        run: python3 tools/launcher_325_regression_guard.py

      - name: Validate owner-only future Launcher release scope
        run: python3 -m unittest discover -s tools/tests -p 'test_launcher_release_scope.py' -v

      - name: Build debug and release variants
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: supra-pda-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: supra-pda-launcher-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 7
