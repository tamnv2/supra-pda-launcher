name: Release APK (Owner scope approval required)

# Deliberately NO push and NO tag triggers. Updating release/version.txt or
# tagging a commit must never silently create a release or change PDA scope.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Next version e.g. 0.3.26 (must be newer than 0.3.25)"
        required: true
        type: string
      rollout_scope:
        description: "Owner decision: ALL, MODEL, or DEVICE"
        required: true
        type: choice
        options:
          - ALL
          - MODEL
          - DEVICE
      rollout_models:
        description: "MODEL only: comma-separated exact Registry models, e.g. DT50 or NLS-MT90"
        required: false
        type: string
      rollout_device_keys:
        description: "DEVICE only: comma-separated 64-character registered DeviceKeys, NEVER raw Serial/MEID"
        required: false
        type: string
      owner_confirmation:
        description: "Type DUYET <version> <scope> (e.g. DUYET 0.3.26 MODEL)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: launcher-owner-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Configure required reviewer tamnv2 for this Environment in GitHub
    # Settings -> Environments. The workflow ALSO verifies github.actor.
    environment: launcher-production

    steps:
      - uses: actions/checkout@v4

      - name: Verify explicit owner identity, scope and exact version BEFORE signing
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ROLLOUT_SCOPE: ${{ inputs.rollout_scope }}
          ROLLOUT_MODELS: ${{ inputs.rollout_models }}
          ROLLOUT_DEVICE_KEYS: ${{ inputs.rollout_device_keys }}
          OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
        run: |
          set -euo pipefail
          python3 tools/launcher_release_owner_gate.py \
            --output dist/launcher-rollout-approval.private.json

      - name: Refuse republishing existing version or tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release already exists. New owner approval required for a different version."
            exit 1
          fi
          if git ls-remote --tags --exit-code origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists; refusing to overwrite a signed release."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match x.y.z"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASS" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build signed APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PVERSION_NAME="${{ steps.version.outputs.version }}" \
            -PVERSION_CODE="${{ steps.version.outputs.version_code }}"

      - name: Verify and prepare release files
        shell: bash
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$SRC"

          mkdir -p dist
          APK="dist/SUPRA-PDA-Launcher-v${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Stamp signed APK SHA and create privacy-safe owner receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/launcher_release_owner_gate.py \
            --finalize dist/launcher-rollout-approval.private.json \
            --apk "dist/SUPRA-PDA-Launcher-v${{ steps.version.outputs.version }}.apk" \
            --receipt dist/launcher-rollout-receipt.json
          echo "Owner approved artifact signing. PDA targeting is NOT active until"
          echo "the Inventory ROOT API applies the matching approved scope."

      - name: Publish GitHub Release (no automatic PDA rollout)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          APK="dist/SUPRA-PDA-Launcher-v${{ steps.version.outputs.version }}.apk"

          # Refuse replacing even a concurrent/partially created release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; never --clobber a signed owner-approved APK."
            exit 1
          fi
          gh release create "$TAG" "$APK" "$APK.sha256" \
            "dist/launcher-rollout-receipt.json" \
            --target "${{ github.sha }}" \
            --title "SUPRA PDA Launcher $TAG (scope: ${{ inputs.rollout_scope }})" \
            --notes "Owner tamnv2 approved scope ${{ inputs.rollout_scope }} for $TAG. Signed APK published only; PDA rollout requires a separate matching authenticated Inventory ROOT policy. The global launcher-channel remains pinned to foundation v0.3.25." \
            --latest=false
