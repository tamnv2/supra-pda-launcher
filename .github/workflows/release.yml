name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'release/version.txt'
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix, for example 0.3.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < release/version.txt)"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match x.y.z"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASS" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build signed APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PVERSION_NAME="${{ steps.version.outputs.version }}" \
            -PVERSION_CODE="${{ steps.version.outputs.version_code }}"

      - name: Verify and prepare release files
        shell: bash
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$SRC"

          mkdir -p dist
          APK="dist/SUPRA-PDA-Launcher-v${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="dist/SUPRA-PDA-Launcher-v${{ steps.version.outputs.version }}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "${{ github.sha }}" \
              --title "SUPRA PDA Launcher $TAG" \
              --generate-notes
          fi

      - name: Publish fixed Launcher update channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          TAG="${{ steps.version.outputs.tag }}"
          SOURCE="${{ github.sha }}"
          SRC="dist/SUPRA-PDA-Launcher-v${VERSION}.apk"
          CHANNEL_APK="dist/SUPRA-PDA-Launcher-latest.apk"
          CHANNEL_SHA="${CHANNEL_APK}.sha256"
          CHANNEL_JSON="dist/launcher-latest.json"

          cp "$SRC" "$CHANNEL_APK"
          SHA256="$(sha256sum "$CHANNEL_APK" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "$CHANNEL_APK")"
          printf '%s  %s\n' "$SHA256" "$(basename "$CHANNEL_APK")" > "$CHANNEL_SHA"

          jq -n \
            --arg version "$VERSION" \
            --argjson version_code "$VERSION_CODE" \
            --arg tag "$TAG" \
            --arg published_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source "$SOURCE" \
            --argjson size_bytes "$SIZE_BYTES" \
            --arg sha256 "$SHA256" \
            '{
              version: $version,
              version_code: $version_code,
              tag: $tag,
              published_at: $published_at,
              source: $source,
              size_bytes: $size_bytes,
              sha256: $sha256
            }' > "$CHANNEL_JSON"

          CHANNEL_TAG="launcher-channel"
          if gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release upload "$CHANNEL_TAG" "$CHANNEL_APK" "$CHANNEL_SHA" "$CHANNEL_JSON" --clobber
          else
            gh release create "$CHANNEL_TAG" "$CHANNEL_APK" "$CHANNEL_SHA" "$CHANNEL_JSON" \
              --target "${{ github.sha }}" \
              --title "SUPRA PDA Launcher Update Channel" \
              --notes "Fixed asset channel consumed by inventory-beta.supra.cc.cd. Do not delete while Launcher auto-update is active."
          fi
