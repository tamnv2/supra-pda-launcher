name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix, for example 0.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match x.y.z"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Restore signing configuration
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n'             "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build signed release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace             -PVERSION_NAME="${{ steps.version.outputs.version }}"             -PVERSION_CODE="${{ steps.version.outputs.version_code }}"

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk             "dist/SUPRA-PDA-Launcher-v${{ steps.version.outputs.version }}.apk"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG"             "dist/SUPRA-PDA-Launcher-v${{ steps.version.outputs.version }}.apk"             --target "${{ github.sha }}"             --title "SUPRA PDA Launcher $TAG"             --generate-notes
